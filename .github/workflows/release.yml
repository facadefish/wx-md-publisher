name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          # GitHub 免费运行器已淘汰 Intel mac（macos-13 无限排队），仅预构建 Apple Silicon 包
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build & smoke
        run: |
          pnpm install --ignore-scripts
          ./node_modules/.bin/tsc --noEmit
          pnpm run test
          ./node_modules/.bin/vite build
          node scripts/smoke.mjs

      - name: Package portable bundle
        run: node scripts/package.mjs ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wx-md-publisher-${{ matrix.target }}
          path: release/wx-md-publisher-*-${{ matrix.target }}.*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
